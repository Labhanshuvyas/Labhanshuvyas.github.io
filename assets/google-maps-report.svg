ng</text><text x="1084" y="204" font-family="Arial" font-size="12px" font-weight="500" fill="#405b52" text-anchor="start">and immersive navigation.</text><circle cx="1102" cy="242" r="15" fill="#36a36c"/><text x="1126" y="245" font-family="Arial" font-size="9px" font-weight="700" fill="#173a57" text-anchor="start">RoadSense Intelligence</text><text x="1126" y="261" font-family="Arial" font-size="8px" fill="#65727c" text-anchor="start">Real-time hazard and road data</text><circle cx="1102" cy="287" r="15" fill="#2e84d1"/><text x="1126" y="290" font-family="Arial" font-size="9px" font-weight="700" fill="#173a57" text-anchor="start">SafePath</text><text x="1126" y="306" font-family="Arial" font-size="8px" fill="#65727c" text-anchor="start">Predictive safety alerts</text><circle cx="1102" cy="332" r="15" fill="#7253cf"/><text x="1126" y="335" font-family="Arial" font-size="9px" font-weight="700" fill="#173a57" text-anchor="start">Gemini Adaptive Routing</text><text x="1126" y="351" font-family="Arial" font-size="8px" fill="#65727c" text-anchor="start">Context and preference aware</text><circle cx="1102" cy="377" r="15" fill="#ee941f"/><text x="1126" y="380" font-family="Arial" font-size="9px" font-weight="700" fill="#173a57" text-anchor="start">Immersive Navigation</text><text x="1126" y="396" font-family="Arial" font-size="8px" fill="#65727c" text-anchor="start">3D + AR guidance</text><text x="40" y="478" font-family="Arial" font-size="13px" font-weight="700" fill="#173a57" text-anchor="start">KEY FEATURES</text><rect x="40" y="502" width="345" height="125" rx="14" fill="#fff" stroke="#d7e0e7"/><text x="55" y="528" font-family="Arial" font-size="10px" font-weight="700" fill="#173a57" text-anchor="start">Hazard Alerts</text><text x="55" y="550" font-family="Arial" font-size="9px" fill="#64717b" text-anchor="start">Potholes, closures, flooding</text><rect x="405" y="502" width="345" height="125" rx="14" fill="#fff" stroke="#d7e0e7"/><text x="420" y="528" font-family="Ari