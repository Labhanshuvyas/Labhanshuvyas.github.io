<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#fbfaf6"/><text x="40" y="48" font-family="Arial" font-size="28px" font-weight="700" fill="#07584f">Kitchen-Genie</text><text x="40" y="76" font-family="Arial" font-size="14px" font-weight="500" fill="#5e686f">Your kitchen, one step ahead.</text><line x1="40" y1="982" x2="1496" y2="982" stroke="#d9d4cc"/><text x="40" y="1006" font-family="Arial" font-size="9px" fill="#7b817f">Visual product report · For portfolio use only</text><text x="1496" y="1006" font-family="Arial" font-size="9px" font-weight="700" fill="#07584f" text-anchor="end">Labhanshu Vyas</text><rect x="40" y="104" width="560" height="300" rx="14" fill="#e9f1e7" stroke="#d5e2d3"/><text x="66" y="146" font-family="Arial" font-size="28px" font-weight="700" fill="#07584f">KITCHEN-GENIE</text><text x="66" y="178" font-family="Arial" font-size="17px" font-weight="600" fill="#1b302c">Your kitchen, one step ahead.</text><text x="66" y="218" font-family="Arial" font-size="12px" fill="#53615c">AI-powered kitchen companion that turns existing ingredients</text><text x="66" y="236" font-family="Arial" font-size="12px" fill="#53615c">into meals, reduces food waste and makes cooking easier.</text><rect x="370" y="270" width="190" height="92" rx="12" fill="#fff" stroke="#d8ded7"/><text x="465" y="306" font-family="Arial" font-size="12px" font-weight="700" fill="#07584f" text-anchor="middle">USE FIRST</text><text x="465" y="328" font-family="Arial" font-size="9px" fill="#53615c" text-anchor="middle">Spinach + rice</text><rect x="620" y="104" width="876" height="300" rx="14" fill="#f1f5ee" stroke="#d9e2d6"/><text x="644" y="138" font-family="Arial" font-size="13px" font-weight="700" fill="#1d5144">THE PROBLEM</text><text x="644" y="168" font-family="Arial" font-size="12px" font-weight="500" fill="#53615c">The kitchen creates hundreds of small decisions.</text><text x="644" y="186" font-family="Arial" font-size="12px" fill="#53615c">The gap is not information — it is a system that</text><text x="644" y="204" font-family="Arial" font-size="12px" fill="#53615c">understands the household’s current state.</text><rect x="644" y="242" width="390" height="50" rx="10" fill="#fff" stroke="#dce3d9"/><text x="658" y="263" font-family="Arial" font-size="9px" font-weight="700" fill="#1d5144">Decision fatigue</text><text x="658" y="279" font-family="Arial" font-size="7px" fill="#53615c">What should I cook?</text><rect x="1054" y="242" width="390" height="50" rx="10" fill="#fff" stroke="#dce3d9"/><text x="1068" y="263" font-family="Arial" font-size="9px" font-weight="700" fill="#1d5144">Invisible inventory</text><text x="1068" y="279" font-family="Arial" font-size="7px" fill="#53615c">What do I actually have?</text><rect x="644" y="306" width="390" height="50" rx="10" fill="#fff" stroke="#dce3d9"/><text x="658" y="327" font-family="Arial" font-size="9px" font-weight="700" fill="#1d5144">Expiration-driven waste</text><text x="658" y="343" font-family="Arial" font-size="7px" fill="#53615c">Fresh food expires before use.</text><rect x="1054" y="306" width="390" height="50" rx="10" fill="#fff" stroke="#dce3d9"/><text x="1068" y="327" font-family="Arial" font-size="9px" font-weight="700" fill="#1d5144">Disconnected planning</text><text x="1068" y="343" font-family="Arial" font-size="7px" fill="#53615c">Meals, groceries and cooking are separate.</text><rect x="40" y="430" width="310" height="250" rx="14" fill="#edf6e9" stroke="#d4e3ce"/><text x="62" y="462" font-family="Arial" font-size="13px" font-weight="700" fill="#07584f">THE SOLUTION</text><text x="62" y="492" font-family="Arial" font-size="10px" fill="#53615c">Kitchen-Genie connects inventory, freshness,</text><text x="62" y="508" font-family="Arial" font-size="10px" fill="#53615c">preferences, plans and habits to recommend</text><text x="62" y="524" font-family="Arial" font-size="10px" fill="#53615c">what to cook, use first and buy next.</text><text x="62" y="622" font-family="Arial" font-size="12px" font-weight="700" fill="#07584f">Not a recipe search engine.</text><text x="62" y="642" font-family="Arial" font-size="10px" fill="#53615c">A decision engine for the kitchen.</text><text x="378" y="430" font-family="Arial" font-size="13px" font-weight="700" fill="#07584f">CORE PRODUCT LOOP</text><circle cx="400" cy="484" r="21" fill="#4b8c69"/><text x="400" y="490" font-family="Arial" font-size="9px" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="430" y="478" font-family="Arial" font-size="8px" font-weight="700" fill="#07584f">SEE</text><text x="430" y="494" font-family="Arial" font-size="7px" fill="#53615c">Understand</text><circle cx="618" cy="484" r="21" fill="#6d5bd0"/><text x="618" y="490" font-family="Arial" font-size="9px" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="648" y="478" font-family="Arial" font-size="8px" font-weight="700" fill="#07584f">THINK</text><text x="648" y="494" font-family="Arial" font-size="7px" fill="#53615c">Prioritise</text><circle cx="836" cy="484" r="21" fill="#d58a4a"/><text x="836" y="490" font-family="Arial" font-size="9px" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="866" y="478" font-family="Arial" font-size="8px" font-weight="700" fill="#07584f">SUGGEST</text><text x="866" y="494" font-family="Arial" font-size="7px" fill="#53615c">Recommend</text><circle cx="1054" cy="484" r="21" fill="#7aa17b"/><text x="1054" y="490" font-family="Arial" font-size="9px" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1084" y="478" font-family="Arial" font-size="8px" font-weight="700" fill="#07584f">ACT</text><text x="1084" y="494" font-family="Arial" font-size="7px" fill="#53615c">Turn plans into meals</text><circle cx="1272" cy="484" r="21" fill="#6d5bd0"/><text x="1272" y="490" font-family="Arial" font-size="9px" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1302" y="478" font-family="Arial" font-size="8px" font-weight="700" fill="#07584f">LEARN</text><text x="1302" y="494" font-family="Arial" font-size="7px" fill="#53615c">Improve over time</text><rect x="1290" y="450" width="206" height="220" rx="14" fill="#fff" stroke="#d8e0d6"/><text x="1310" y="482" font-family="Arial" font-size="11px" font-weight="700" fill="#07584f">USE THIS FIRST</text><text x="1310" y="512" font-family="Arial" font-size="8px" fill="#53615c">Turns inventory + freshness</text><text x="1310" y="528" font-family="Arial" font-size="8px" fill="#53615c">into a clear next action.</text><text x="40" y="706" font-family="Arial" font-size="13px" font-weight="700" fill="#07584f">INTELLIGENCE</text><rect x="40" y="730" width="345" height="110" rx="14" fill="#fff" stroke="#d8e0d6"/><text x="55" y="756" font-family="Arial" font-size="9px" font-weight="700" fill="#07584f">Grocery intelligence</text><text x="55" y="782" font-family="Arial" font-size="8px" fill="#53615c">Already have · Buy · Don’t buy</text><rect x="408" y="730" width="345" height="110" rx="14" fill="#fff" stroke="#d8e0d6"/><text x="423" y="756" font-family="Arial" font-size="9px" font-weight="700" fill="#07584f">Leftover intelligence</text><text x="423" y="782" font-family="Arial" font-size="8px" fill="#53615c">Tracks leftovers · suggests meals</text><rect x="776" y="730" width="345" height="110" rx="14" fill="#fff" stroke="#d8e0d6"/><text x="791" y="756" font-family="Arial" font-size="9px" font-weight="700" fill="#07584f">Personalisation</text><text x="791" y="782" font-family="Arial" font-size="8px" fill="#53615c">Learns cuisine, time, budget, goals</text><rect x="1144" y="730" width="345" height="110" rx="14" fill="#fff" stroke="#d8e0d6"/><text x="1159" y="756" font-family="Arial" font-size="9px" font-weight="700" fill="#07584f">Connected kitchen</text><text x="1159" y="782" font-family="Arial" font-size="8px" fill="#53615c">Future: devices + delivery</text><rect x="40" y="868" width="345" height="94" rx="14" fill="#fff" stroke="#d8e0d6"/><text x="54" y="896" font-family="Arial" font-size="9px" font-weight="700" fill="#07584f">MVP</text><text x="54" y="916" font-family="Arial" font-size="7px" fill="#53615c">Inventory · expiry · use-first · meal plan</text><rect x="408" y="868" width="345" height="94" rx="14" fill="#fff" stroke="#d8e0d6"/><text x="422" y="896" font-family="Arial" font-size="9px" font-weight="700" fill="#07584f">BUSINESS</text><text x="422" y="916" font-family="Arial" font-size="7px" fill="#53615c">Freemium + subscription · partnerships</text><rect x="776" y="868" width="345" height="94" rx="14" fill="#fff" stroke="#d8e0d6"/><text x="790" y="896" font-family="Arial" font-size="9px" font-weight="700" fill="#07584f">NORTH STAR</text><text x="790" y="916" font-family="Arial" font-size="7px" fill="#53615c">Successful meals from existing inventory</text><rect x="1144" y="868" width="345" height="94" rx="14" fill="#fff" stroke="#d8e0d6"/><text x="1158" y="896" font-family="Arial" font-size="9px" font-weight="700" fill="#07584f">RISKS</text><text x="1158" y="916" font-family="Arial" font-size="7px" fill="#53615c">Input accuracy · privacy · adoption</text></svg>