<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536"><rect width="1024" height="1536" fill="#f8f6f1"/><text x="40" y="48" font-family="Arial" font-size="28px" font-weight="700" fill="#123a67">SkyServe</text><text x="40" y="76" font-family="Arial" font-size="14px" font-weight="500" fill="#5e686f">YOUR AIRPORT, BROUGHT TO YOU.</text><line x1="40" y1="1494" x2="984" y2="1494" stroke="#d9d4cc"/><text x="40" y="1518" font-family="Arial" font-size="9px" fill="#7b817f">Visual product report · For portfolio use only</text><text x="984" y="1518" font-family="Arial" font-size="9px" font-weight="700" fill="#123a67" text-anchor="end">Labhanshu Vyas</text><rect x="30" y="104" width="964" height="240" rx="14" fill="#fff" stroke="#ddd7ce"/><text x="58" y="154" font-family="Arial" font-size="34px" font-weight="700" fill="#123a67">SKYSERVE</text><text x="58" y="184" font-family="Arial" font-size="13px" font-weight="500" fill="#52616b">YOUR AIRPORT, BROUGHT TO YOU.</text><text x="58" y="224" font-family="Arial" font-size="12px" font-weight="500" fill="#52616b">Food. Shopping. Essentials. Duty-Free. Services.</text><text x="58" y="244" font-family="Arial" font-size="12px" font-weight="500" fill="#52616b">Order, pick up, or get it delivered — anywhere in the airport.</text><rect x="700" y="136" width="240" height="170" rx="14" fill="#eef3f7" stroke="#d7e0e6"/><circle cx="820" cy="190" r="52" fill="#cfe1ef"/><text x="820" y="197" font-family="Arial" font-size="17px" font-weight="700" fill="#123a67" text-anchor="middle">A14</text><text x="820" y="224" font-family="Arial" font-size="10px" font-weight="600" fill="#52616b" text-anchor="middle">08 min</text><rect x="30" y="374" width="300" height="300" rx="14" fill="#fff" stroke="#ddd7ce"/><rect x="348" y="374" width="300" height="300" rx="14" fill="#fff" stroke="#ddd7ce"/><rect x="666" y="374" width="328" height="300" rx="14" fill="#edf5fb" stroke="#d5e2ec"/><text x="52" y="408" font-family="Arial" font-size="13px" font-weight="700" fill="#123a67">THE OPPORTUNITY</text><text x="370" y="408" font-family="Arial" font-size="13px" font-weight="700" fill="#123a67">THE PAIN POINTS</text><text x="688" y="408" font-family="Arial" font-size="13px" font-weight="700" fill="#123a67">OUR SOLUTION</text><text x="52" y="440" font-family="Arial" font-size="10px" fill="#52616b">Airports are full of choices, but not everyone</text><text x="52" y="456" font-family="Arial" font-size="10px" fill="#52616b">can easily access them. Passengers navigate</text><text x="52" y="472" font-family="Arial" font-size="10px" fill="#52616b">large terminals for everyday needs.</text><text x="688" y="440" font-family="Arial" font-size="10px" font-weight="600" fill="#123a67">A digital marketplace that brings the airport</text><text x="688" y="456" font-family="Arial" font-size="10px" fill="#52616b">to the passenger instead of the passenger</text><text x="688" y="472" font-family="Arial" font-size="10px" fill="#52616b">to every terminal store.</text><circle cx="370" cy="510" r="9" fill="#e8ded1"/><text x="390" y="513" font-family="Arial" font-size="8px" font-weight="700" fill="#173a57">Physical extension</text><text x="390" y="528" font-family="Arial" font-size="7px" fill="#68747c">Long walking distances</text><circle cx="370" cy="553" r="9" fill="#e8ded1"/><text x="390" y="556" font-family="Arial" font-size="8px" font-weight="700" fill="#173a57">Time pressure</text><text x="390" y="571" font-family="Arial" font-size="7px" fill="#68747c">Tight connections</text><circle cx="370" cy="596" r="9" fill="#e8ded1"/><text x="390" y="599" font-family="Arial" font-size="8px" font-weight="700" fill="#173a57">Price / choice</text><text x="390" y="614" font-family="Arial" font-size="7px" fill="#68747c">Hard to compare</text><circle cx="370" cy="639" r="9" fill="#e8ded1"/><text x="390" y="642" font-family="Arial" font-size="8px" font-weight="700" fill="#173a57">Stress</text><text x="390" y="657" font-family="Arial" font-size="7px" fill="#68747c">Crowds + uncertainty</text><circle cx="370" cy="682" r="9" fill="#e8ded1"/><text x="390" y="685" font-family="Arial" font-size="8px" font-weight="700" fill="#173a57">Forgotten essentials</text><text x="390" y="700" font-family="Arial" font-size="7px" fill="#68747c">Chargers, care, travel</text><text x="688" y="520" font-family="Arial" font-size="10px" font-weight="700" fill="#1c7055">✓</text><text x="704" y="520" font-family="Arial" font-size="8px" fill="#52616b">Real-time location &amp; flight context</text><text x="688" y="546" font-family="Arial" font-size="10px" font-weight="700" fill="#1c7055">✓</text><text x="704" y="546" font-family="Arial" font-size="8px" fill="#52616b">Delivery · pickup · scheduled fulfilment</text><text x="688" y="572" font-family="Arial" font-size="10px" font-weight="700" fill="#1c7055">✓</text><text x="704" y="572" font-family="Arial" font-size="8px" fill="#52616b">Food · retail · duty-free · essentials</text><text x="688" y="598" font-family="Arial" font-size="10px" font-weight="700" fill="#1c7055">✓</text><text x="704" y="598" font-family="Arial" font-size="8px" fill="#52616b">Accessible by design</text><text x="688" y="624" font-family="Arial" font-size="10px" font-weight="700" fill="#1c7055">✓</text><text x="704" y="624" font-family="Arial" font-size="8px" fill="#52616b">Transparent pricing</text><text x="30" y="716" font-family="Arial" font-size="13px" font-weight="700" fill="#123a67">TARGET USERS</text><text x="348" y="716" font-family="Arial" font-size="13px" font-weight="700" fill="#123a67">HOW IT WORKS</text><text x="666" y="716" font-family="Arial" font-size="13px" font-weight="700" fill="#123a67">SERVICE CATEGORIES</text><rect x="30" y="748" width="90" height="64" rx="9" fill="#fff" stroke="#ddd7ce"/><text x="75" y="787" font-family="Arial" font-size="7px" fill="#52616b" text-anchor="middle">Elderly</text><rect x="132" y="748" width="90" height="64" rx="9" fill="#fff" stroke="#ddd7ce"/><text x="177" y="787" font-family="Arial" font-size="7px" fill="#52616b" text-anchor="middle">Pregnant</text><rect x="234" y="748" width="90" height="64" rx="9" fill="#fff" stroke="#ddd7ce"/><text x="279" y="787" font-family="Arial" font-size="7px" fill="#52616b" text-anchor="middle">Reduced mobility</text><rect x="30" y="830" width="90" height="64" rx="9" fill="#fff" stroke="#ddd7ce"/><text x="75" y="869" font-family="Arial" font-size="7px" fill="#52616b" text-anchor="middle">Families</text><rect x="132" y="830" width="90" height="64" rx="9" fill="#fff" stroke="#ddd7ce"/><text x="177" y="869" font-family="Arial" font-size="7px" fill="#52616b" text-anchor="middle">Time-constrained</text><rect x="234" y="830" width="90" height="64" rx="9" fill="#fff" stroke="#ddd7ce"/><text x="279" y="869" font-family="Arial" font-size="7px" fill="#52616b" text-anchor="middle">Frequent flyers</text><circle cx="370" cy="750" r="10" fill="#123a67"/><text x="370" y="753" font-family="Arial" font-size="7px" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="390" y="753" font-family="Arial" font-size="8px" fill="#173a57">Scan &amp; Open</text><circle cx="370" cy="792" r="10" fill="#123a67"/><text x="370" y="795" font-family="Arial" font-size="7px" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="390" y="795" font-family="Arial" font-size="8px" fill="#173a57">Share your flight</text><circle cx="370" cy="834" r="10" fill="#123a67"/><text x="370" y="837" font-family="Arial" font-size="7px" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="390" y="837" font-family="Arial" font-size="8px" fill="#173a57">Browse &amp; Choose</text><circle cx="370" cy="876" r="10" fill="#123a67"/><text x="370" y="879" font-family="Arial" font-size="7px" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="390" y="879" font-family="Arial" font-size="8px" fill="#173a57">Select fulfilment</text><circle cx="370" cy="918" r="10" fill="#123a67"/><text x="370" y="921" font-family="Arial" font-size="7px" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="390" y="921" font-family="Arial" font-size="8px" fill="#173a57">Track &amp; Receive</text><rect x="666" y="748" width="138" height="37" rx="8" fill="#fff" stroke="#ddd7ce"/><text x="735" y="771" font-family="Arial" font-size="7px" fill="#52616b" text-anchor="middle">Food &amp; Beverages</text><rect x="816" y="748" width="138" height="37" rx="8" fill="#fff" stroke="#ddd7ce"/><text x="885" y="771" font-family="Arial" font-size="7px" fill="#52616b" text-anchor="middle">Retail &amp; Essentials</text><rect x="666" y="795" width="138" height="37" rx="8" fill="#fff" stroke="#ddd7ce"/><text x="735" y="818" font-family="Arial" font-size="7px" fill="#52616b" text-anchor="middle">Duty-Free &amp; Gifts</text><rect x="816" y="795" width="138" height="37" rx="8" fill="#fff" stroke="#ddd7ce"/><text x="885" y="818" font-family="Arial" font-size="7px" fill="#52616b" text-anchor="middle">Health &amp; Care</text><rect x="666" y="842" width="138" height="37" rx="8" fill="#fff" stroke="#ddd7ce"/><text x="735" y="865" font-family="Arial" font-size="7px" fill="#52616b" text-anchor="middle">Travel Accessories</text><rect x="816" y="842" width="138" height="37" rx="8" fill="#fff" stroke="#ddd7ce"/><text x="885" y="865" font-family="Arial" font-size="7px" fill="#52616b" text-anchor="middle">Airport Services</text><rect x="30" y="1010" width="300" height="330" rx="14" fill="#fff" stroke="#ddd7ce"/><rect x="348" y="1010" width="300" height="330" rx="14" fill="#fff" stroke="#ddd7ce"/><rect x="666" y="1010" width="328" height="330" rx="14" fill="#fff" stroke="#ddd7ce"/><text x="52" y="1044" font-family="Arial" font-size="13px" font-weight="700" fill="#123a67">MVP SCOPE</text><text x="370" y="1044" font-family="Arial" font-size="13px" font-weight="700" fill="#123a67">BUSINESS MODEL</text><text x="688" y="1044" font-family="Arial" font-size="13px" font-weight="700" fill="#123a67">METRICS &amp; RISKS</text><text x="52" y="1080" font-family="Arial" font-size="7px" font-weight="700" fill="#123a67">●</text><text x="68" y="1080" font-family="Arial" font-size="8px" fill="#52616b">One terminal</text><text x="52" y="1118" font-family="Arial" font-size="7px" font-weight="700" fill="#123a67">●</text><text x="68" y="1118" font-family="Arial" font-size="8px" fill="#52616b">10–20 vendors</text><text x="52" y="1156" font-family="Arial" font-size="7px" font-weight="700" fill="#123a67">●</text><text x="68" y="1156" font-family="Arial" font-size="8px" fill="#52616b">QR + mobile web</text><text x="52" y="1194" font-family="Arial" font-size="7px" font-weight="700" fill="#123a67">●</text><text x="68" y="1194" font-family="Arial" font-size="8px" fill="#52616b">Pickup + limited delivery</text><text x="52" y="1232" font-family="Arial" font-size="7px" font-weight="700" fill="#123a67">●</text><text x="68" y="1232" font-family="Arial" font-size="8px" fill="#52616b">Basic flight context</text><text x="52" y="1270" font-family="Arial" font-size="7px" font-weight="700" fill="#123a67">●</text><text x="68" y="1270" font-family="Arial" font-size="8px" fill="#52616b">Secure payments</text><text x="370" y="1080" font-family="Arial" font-size="8px" font-weight="700" fill="#173a57">Vendor commission</text><text x="370" y="1095" font-family="Arial" font-size="7px" fill="#68747c">% of order value</text><text x="370" y="1128" font-family="Arial" font-size="8px" font-weight="700" fill="#173a57">Delivery / service fee</text><text x="370" y="1143" font-family="Arial" font-size="7px" fill="#68747c">Eligible orders</text><text x="370" y="1176" font-family="Arial" font-size="8px" font-weight="700" fill="#173a57">Sponsored placement</text><text x="370" y="1191" font-family="Arial" font-size="7px" fill="#68747c">Featured deals</text><text x="370" y="1224" font-family="Arial" font-size="8px" font-weight="700" fill="#173a57">Airport partnership</text><text x="370" y="1239" font-family="Arial" font-size="7px" fill="#68747c">Commercial / service fee</text><text x="370" y="1272" font-family="Arial" font-size="8px" font-weight="700" fill="#173a57">SkyServe Pass</text><text x="370" y="1287" font-family="Arial" font-size="7px" fill="#68747c">Future loyalty layer</text><text x="688" y="1080" font-family="Arial" font-size="9px" font-weight="700" fill="#173a57">North Star</text><text x="688" y="1098" font-family="Arial" font-size="9px" font-weight="600" fill="#123a67">Successful passenger fulfilments</text><text x="688" y="1114" font-family="Arial" font-size="9px" font-weight="600" fill="#123a67">before boarding.</text><text x="688" y="1160" font-family="Arial" font-size="8px" fill="#52616b">Operational: on-time delivery,</text><text x="688" y="1176" font-family="Arial" font-size="8px" fill="#52616b">order-to-receipt, refunds.</text><text x="688" y="1220" font-family="Arial" font-size="8px" fill="#52616b">Risks: operations · vendors · costs</text><text x="688" y="1236" font-family="Arial" font-size="8px" fill="#52616b">regulation · flight / terminal changes.</text><rect x="30" y="1370" width="964" height="80" rx="14" fill="#123a67" stroke="#123a67"/><text x="512" y="1418" font-family="Arial" font-size="20px" font-weight="700" fill="#fff" text-anchor="middle">Less walking. More journeys.</text></svg>