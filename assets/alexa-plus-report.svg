 fill="#52626d">Weekly engaged users · visual interactions / week · repeat sessions</text><text x="52" y="1342" font-family="Arial" font-size="10px" fill="#52626d">Experience satisfaction · Echo Show conversion · Kids+ engagement</text><text x="52" y="1390" font-family="Arial" font-size="9px" font-weight="700" fill="#a55a16">Risks</text><text x="92" y="1390" font-family="Arial" font-size="9px" fill="#65727c">Child safety &amp; privacy · emotional dependency · hallucinations · hardware limits</text><rect x="30" y="1470" width="964" height="36" rx="14" fill="#0d1724"/><text x="512" y="1494" font-family="Arial" font-size="12px" font-weight="700" fill="#fff" text-anchor="middle">More than answers. A companion in the home.</text></svg>