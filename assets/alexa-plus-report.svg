<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536"><rect width="1024" height="1536" fill="#f5f8fc"/><text x="40" y="48" font-family="Arial" font-size="28px" font-weight="700" fill="#168ad0">Amazon | Alexa+ — Visual AI Companion</text><text x="40" y="76" font-family="Arial" font-size="14px" font-weight="500" fill="#5e686f">From voice assistant to a more visual, interactive household experience.</text><line x1="40" y1="1494" x2="984" y2="1494" stroke="#d9d4cc"/><text x="40" y="1518" font-family="Arial" font-size="9px" fill="#7b817f">Visual product report · For portfolio use only</text><text x="984" y="1518" font-family="Arial" font-size="9px" font-weight="700" fill="#168ad0" text-anchor="end">Labhanshu Vyas</text><rect x="30" y="104" width="964" height="240" rx="14" fill="#0d1724"/><text x="58" y="148" font-family="Arial" font-size="23px" font-weight="700" fill="#fff">FROM VOICE ASSISTANT TO</text><text x="58" y="184" font-family="Arial" font-size="32px" font-weight="700" fill="#4fc1ff">VISUAL AI COMPANION</text><text x="58" y="218" font-family="Arial" font-size="13px" fill="#dbe8f4">Make intelligence more visual, interactive and engaging</text><text x="58" y="238" font-family="Arial" font-size="13px" fill="#dbe8f4">for every member of the household.</text><circle cx="820" cy="210" r="70" fill="#70747a"/><circle cx="820" cy="210" r="43" fill="#b9d9ef"/><text x="820" y="218" font-family="Arial" font-size="21px" font-weight="700" fill="#fff" text-anchor="middle">AI</text><rect x="30" y="374" width="465" height="300" rx="14" fill="#eef7ff" stroke="#d6e6f2"/><rect x="515" y="374" width="479" height="300" rx="14" fill="#eefbf7" stroke="#d7e9e0"/><text x="52" y="408" font-family="Arial" font-size="13px" font-weight="700" fill="#173a57">1. THE CUSTOMER PROBLEM</text><text x="537" y="408" font-family="Arial" font-size="13px" font-weight="700" fill="#175743">2. PROPOSED SOLUTION</text><text x="52" y="438" font-family="Arial" font-size="11px" fill="#52626d">Voice is powerful, but limited for experiences</text><text x="52" y="456" font-family="Arial" font-size="11px" fill="#52626d">that need visual context, expression, demonstration</text><text x="52" y="474" font-family="Arial" font-size="11px" fill="#52626d">or sustained engagement.</text><text x="537" y="438" font-family="Arial" font-size="11px" fill="#52626d">A responsive 3D / animated AI avatar layer</text><text x="537" y="456" font-family="Arial" font-size="11px" fill="#52626d">across compatible Echo devices, starting with</text><text x="537" y="474" font-family="Arial" font-size="11px" fill="#52626d">Echo Show.</text><circle cx="61" cy="520" r="11" fill="#3b64e6"/><text x="80" y="523" font-family="Arial" font-size="8px" font-weight="700" fill="#173a57">Conversational Avatar</text><text x="80" y="540" font-family="Arial" font-size="7px" fill="#65727c">Expressions · gestures</text><circle cx="291" cy="520" r="11" fill="#27a68d"/><text x="310" y="523" font-family="Arial" font-size="8px" font-weight="700" fill="#173a57">Interactive Learning</text><text x="310" y="540" font-family="Arial" font-size="7px" fill="#65727c">Homework · storytelling</text><circle cx="61" cy="588" r="11" fill="#8b5cf6"/><text x="80" y="591" font-family="Arial" font-size="8px" font-weight="700" fill="#173a57">Entertainment &amp; Games</text><text x="80" y="608" font-family="Arial" font-size="7px" fill="#65727c">Stories · games · family</text><circle cx="291" cy="588" r="11" fill="#168ad0"/><text x="310" y="591" font-family="Arial" font-size="8px" font-weight="700" fill="#173a57">Visual Commerce</text><text x="310" y="608" font-family="Arial" font-size="7px" fill="#65727c">Demos · comparisons</text><text x="30" y="718" font-family="Arial" font-size="13px" font-weight="700" fill="#173a57">3. EXPERIENCE IN ACTION</text><text x="30" y="748" font-family="Arial" font-size="18px" font-weight="600" fill="#173a57">“Alexa, I’m bored.”</text><rect x="30" y="776" width="228" height="15